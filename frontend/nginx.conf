server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This prevents Nginx from crashing at startup when looking up backends
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend_upstream https://backend-pmwn-production.up.railway.app;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host backend-pmwn-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
