server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://backend-pmwn-production.up.railway.app/;
        proxy_http_version 1.1;
        proxy_set_header Host backend-pmwn-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
