services:
  backend:
    build: ./backend
    container_name: ai-productivity-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/productivity
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app

  frontend:
    build: ./frontend
    container_name: ai-productivity-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  db:
    image: postgres:16-alpine
    container_name: ai-productivity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productivity
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  backend_data:
